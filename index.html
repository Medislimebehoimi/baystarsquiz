<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>横浜DeNAベイスターズ 選手当てクイズ 2026</title>
    <style>
        :root {
            --blue: #003F8E; --yellow: #b59f3b; --green: #538d4e; --gray: #3a3a3c; --black: #121213;
        }
        body { background-color: var(--black); color: white; font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
        .grid { display: flex; flex-direction: column; gap: 8px; max-width: 600px; margin: 20px auto; }
        .row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr; gap: 5px; }
        .cell { height: 50px; display: flex; align-items: center; justify-content: center; border: 2px solid #3a3a3c; font-size: 14px; font-weight: bold; border-radius: 4px; }
        .correct { background-color: var(--green); border-color: var(--green); }
        .near { background-color: var(--yellow); border-color: var(--yellow); }
        .wrong { background-color: var(--gray); border-color: var(--gray); }
        .input-area { margin-top: 30px; }
        select { padding: 12px; font-size: 18px; width: 250px; border-radius: 5px; border: none; cursor: pointer; }
        .btn { padding: 12px 20px; font-size: 18px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; margin-left: 10px; }
        .submit-btn { background-color: var(--blue); color: white; }
        .reset-btn { background-color: #ffffff; color: #000000; display: none; margin: 20px auto; }
        #result-image-container { display: none; margin: 20px auto; max-width: 450px; }
        #result-image-container img { width: 100%; border-radius: 10px; border: 4px solid var(--blue); }
        #hint-display { margin-top: 20px; color: #00AEEF; font-weight: bold; min-height: 1.2em; }
        .header-row { font-size: 10px; color: #818384; text-transform: uppercase; margin-bottom: 5px; }
    </style>
</head>
<body>

    <h1>BAYSTARS QUIZ</h1>
    <p>各項目で、合ってたら緑、惜しかったら黄色くなります。年齢は±2歳、身長は±5cmで黄色判定です。また、年齢は２０２６年シーズン終了時点（１２月３１日）のものになります。</p>

    <div class="input-area" id="controls">
        <select id="playerSelect"><option value="">選手を選択...</option></select>
        <button class="btn submit-btn" id="submitBtn" onclick="submitGuess()">決定</button>
    </div>

    <div id="result-image-container">
        <h2 id="result-message" style="color: #00AEEF;"></h2>
        <img id="winImage" src="" alt="正解画像">
    </div>

    <button class="btn reset-btn" id="resetBtn" onclick="resetGame()">もう一度遊ぶ</button>
    <div id="hint-display"></div>

    <div class="grid" id="gameBoard">
        <div class="row header-row">
            <div>選手名</div><div>ポジ</div><div>投打</div><div>年齢</div><div>経緯</div><div>身長</div>
        </div>
    </div>

<script>
const IMG_EXCELLENT = "appare.jpg"; 
const IMG_GOOD = "katsu.jpg";

const players = [
    {n:"デュプランティエ",p:"投手",h:"右左",a:32,r:"海外",s:193}, {n:"東克樹",p:"投手",h:"左左",a:31,r:"大卒",s:170},
    {n:"竹田祐",p:"投手",h:"右右",a:27,r:"社卒",s:184}, {n:"伊勢大夢",p:"投手",h:"右右",a:28,r:"大卒",s:181},
    {n:"石田健大",p:"投手",h:"左左",a:33,r:"大卒",s:175}, {n:"島田舜也",p:"投手",h:"右右",a:19,r:"高卒",s:183},
    {n:"大貫晋一",p:"投手",h:"右右",a:32,r:"社卒",s:181}, {n:"小園健太",p:"投手",h:"右右",a:23,r:"高卒",s:185},
    {n:"山﨑康晃",p:"投手",h:"右右",a:34,r:"大卒",s:179}, {n:"坂本裕哉",p:"投手",h:"左左",a:29,r:"大卒",s:180},
    {n:"入江大生",p:"投手",h:"右右",a:28,r:"大卒",s:187}, {n:"吉野光樹",p:"投手",h:"右右",a:28,r:"社卒",s:176},
    {n:"藤浪晋太郎",p:"投手",h:"右右",a:32,r:"高卒",s:197}, {n:"篠木健太郎",p:"投手",h:"右左",a:24,r:"大卒",s:177},
    {n:"武田陸玖",p:"投手",h:"左左",a:21,r:"高卒",s:174}, {n:"橋本達弥",p:"投手",h:"右右",a:26,r:"大卒",s:181},
    {n:"松本凌人",p:"投手",h:"右右",a:25,r:"大卒",s:183}, {n:"若松尚輝",p:"投手",h:"右右",a:26,r:"独立",s:185},
    {n:"佐々木千隼",p:"投手",h:"右右",a:32,r:"大卒",s:181}, {n:"コックス",p:"投手",h:"左左",a:29,r:"海外",s:188},
    {n:"深沢鳳介",p:"投手",h:"右右",a:23,r:"高卒",s:177}, {n:"森原康平",p:"投手",h:"右左",a:35,r:"社卒",s:185},
    {n:"坂口翔颯",p:"投手",h:"右右",a:23,r:"大卒",s:180}, {n:"片山皓心",p:"投手",h:"左左",a:28,r:"社卒",s:175},
    {n:"ルイーズ",p:"投手",h:"右右",a:32,r:"海外",s:190}, {n:"中川颯",p:"投手",h:"右左",a:28,r:"大卒",s:184},
    {n:"石田裕太郎",p:"投手",h:"右右",a:24,r:"大卒",s:180}, {n:"平良拳太郎",p:"投手",h:"右右",a:31,r:"高卒",s:180},
    {n:"レイノルズ",p:"投手",h:"右左",a:31,r:"海外",s:201}, {n:"中川虎大",p:"投手",h:"右右",a:27,r:"高卒",s:178},
    {n:"宮城滝太",p:"投手",h:"右右",a:26,r:"高卒",s:181}, {n:"岩田将貴",p:"投手",h:"左左",a:28,r:"大卒",s:178},
    {n:"堀岡隼人",p:"投手",h:"右右",a:28,r:"高卒",s:182}, {n:"マルセリーノ",p:"投手",h:"右右",a:24,r:"海外",s:190},
    {n:"松尾汐恩",p:"捕手",h:"右右",a:22,r:"高卒",s:178}, {n:"戸柱恭孝",p:"捕手",h:"右左",a:36,r:"社卒",s:179},
    {n:"益子京右",p:"捕手",h:"右右",a:26,r:"高卒",s:176}, {n:"山本祐大",p:"捕手",h:"右右",a:28,r:"独立",s:178},
    {n:"東妻純平",p:"捕手",h:"右右",a:25,r:"高卒",s:175}, {n:"古市尊",p:"捕手",h:"右右",a:24,r:"独立",s:176},
    {n:"九鬼隆平",p:"捕手",h:"右右",a:28,r:"高卒",s:181}, {n:"林琢真",p:"内野手",h:"右左",a:26,r:"大卒",s:174},
    {n:"牧秀悟",p:"内野手",h:"右右",a:28,r:"大卒",s:178}, {n:"小田康一郎",p:"内野手",h:"右左",a:23,r:"大卒",s:173},
    {n:"森敬斗",p:"内野手",h:"右左",a:24,r:"高卒",s:175}, {n:"京田陽太",p:"内野手",h:"右左",a:32,r:"大卒",s:184},
    {n:"筒香嘉智",p:"内野手",h:"右左",a:35,r:"高卒",s:185}, {n:"三森大貴",p:"内野手",h:"右左",a:27,r:"高卒",s:184},
    {n:"柴田竜拓",p:"内野手",h:"右左",a:33,r:"大卒",s:167}, {n:"宮下朝陽",p:"内野手",h:"右右",a:22,r:"高卒",s:182},
    {n:"加藤響",p:"内野手",h:"右右",a:24,r:"独立",s:180}, {n:"石上泰輝",p:"内野手",h:"右左",a:25,r:"大卒",s:172},
    {n:"成瀬脩人",p:"内野手",h:"右右",a:23,r:"大卒",s:180}, {n:"宮﨑敏郎",p:"内野手",h:"右右",a:38,r:"社卒",s:172},
    {n:"田内真翔",p:"内野手",h:"右右",a:20,r:"高卒",s:177}, {n:"ビシエド",p:"内野手",h:"右右",a:37,r:"海外",s:185},
    {n:"度会隆輝",p:"外野手",h:"右左",a:24,r:"社卒",s:183}, {n:"佐野恵太",p:"外野手",h:"右左",a:32,r:"大卒",s:178},
    {n:"神里和毅",p:"外野手",h:"右左",a:32,r:"社卒",s:178}, {n:"勝又温史",p:"外野手",h:"右左",a:26,r:"高卒",s:180},
    {n:"井上絢登",p:"外野手",h:"右左",a:26,r:"独立",s:178}, {n:"梶原昂希",p:"外野手",h:"右左",a:27,r:"大卒",s:189},
    {n:"蝦名達夫",p:"外野手",h:"右右",a:29,r:"大卒",s:185}, {n:"関根大気",p:"外野手",h:"左左",a:31,r:"高卒",s:173},
    {n:"濱将乃介",p:"外野手",h:"右左",a:26,r:"独立",s:181}, {n:"ヒュンメル",p:"外野手",h:"右両",a:32,r:"海外",s:178}
];

let answer;
let guessCount = 0;
const hintDisplay = document.getElementById('hint-display');
const playerSelect = document.getElementById('playerSelect');
const resetBtn = document.getElementById('resetBtn');
const submitBtn = document.getElementById('submitBtn');
const imageContainer = document.getElementById('result-image-container');
const winImage = document.getElementById('winImage');
const resultMsg = document.getElementById('result-message');

function initGame() {
    answer = players[Math.floor(Math.random() * players.length)];
    guessCount = 0;
    hintDisplay.innerText = "";
    resetBtn.style.display = "none";
    imageContainer.style.display = "none";
    submitBtn.disabled = false;
    playerSelect.disabled = false;
    playerSelect.innerHTML = '<option value="">選手を選択...</option>';
    
    const posOrder = { "投手": 1, "捕手": 2, "内野手": 3, "外野手": 4 };
    const sortedPlayers = [...players].sort((a, b) => {
        if (posOrder[a.p] !== posOrder[b.p]) return posOrder[a.p] - posOrder[b.p];
        return a.n.localeCompare(b.n, 'ja');
    });

    sortedPlayers.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.n;
        opt.innerText = `[${p.p}] ${p.n}`;
        playerSelect.appendChild(opt);
    });
}

function submitGuess() {
    const guessName = playerSelect.value;
    if (!guessName) return;
    guessCount++;
    const guessPlayer = players.find(p => p.n === guessName);
    addResultRow(guessPlayer);
    if (guessName === answer.n) {
        winImage.src = (guessCount <= 5) ? IMG_EXCELLENT : IMG_GOOD;
        resultMsg.innerText = (guessCount <= 5) ? `${guessCount}手で正解！ハッハハハハ！` : `時間が長いよな。正解までの。${guessCount}手？待ってる時間長いで。ほんま。`;
        imageContainer.style.display = "block";
        submitBtn.disabled = true;
        playerSelect.disabled = true;
        resetBtn.style.display = "block";
    } else if (guessCount % 5 === 0) {
        giveHint();
    }
    playerSelect.value = "";
}

function resetGame() {
    const board = document.getElementById('gameBoard');
    board.innerHTML = '<div class="row header-row"><div>選手名</div><div>ポジ</div><div>投打</div><div>年齢</div><div>経緯</div><div>身長</div></div>';
    initGame();
}

function giveHint() {
    const hintOptions = [
        {l: "年齢", v: answer.a + "歳"},
        {l: "身長", v: answer.s + "cm"}
    ];
    const picked = hintOptions[Math.floor(Math.random() * hintOptions.length)];
    hintDisplay.innerText = `【５連続不正解……】ヒント：正解選手の「${picked.l}」は「${picked.v}」です。`;
}

function addResultRow(p) {
    const board = document.getElementById('gameBoard');
    const row = document.createElement('div');
    row.className = 'row';
    const check = (val, target, type) => {
        if (val === target) return 'correct';
        if (type === 'hand') { if (val[0] === target[0] || val[1] === target[1]) return 'near'; }
        if (type === 'age' && Math.abs(val - target) <= 2) return 'near';
        if (type === 'height' && Math.abs(val - target) <= 5) return 'near';
        return 'wrong';
    };
    const cells = [
        {txt: p.n, cls: check(p.n, answer.n)},
        {txt: (p.p === '投手' ? '投手' : '野手'), cls: check((p.p === '投手' ? '投手' : '野手'), (answer.p === '投手' ? '投手' : '野手'))},
        {txt: p.h, cls: check(p.h, answer.h, 'hand')},
        {txt: p.a + "歳", cls: check(p.a, answer.a, 'age')},
        {txt: p.r, cls: check(p.r, answer.r)},
        {txt: p.s + "cm", cls: check(p.s, answer.s, 'height')}
    ];
    cells.forEach(c => {
        const div = document.createElement('div');
        div.className = 'cell ' + c.cls;
        div.innerText = c.txt;
        row.appendChild(div);
    });
    board.appendChild(row);
}
initGame();
</script>
</body>
</html>
